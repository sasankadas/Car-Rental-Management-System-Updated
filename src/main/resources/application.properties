spring.application.name=Car_Rental_Management_System
server.port=${SERVER_PORT:8080}

# Public base URL of this deployment - used to build links inside emails (verification, etc.)
app.base-url=${APP_BASE_URL:http://localhost:8080}

# --------------------------------------------------------------------------
# Database Configuration
# Override these with real values via environment variables before deploying.
# Example (Linux/macOS):
#   export DB_URL=jdbc:mysql://127.0.0.1:3306/car_rental_system
#   export DB_USERNAME=root
#   export DB_PASSWORD=yourpassword
# --------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/car_rental_system}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# --------------------------------------------------------------------------
# Mail Configuration (used for signup verification & OTP emails).
# Use a Gmail "App Password", never your normal account password.
# --------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:sasankadas1012@gmail.com}
spring.mail.password=${MAIL_PASSWORD:eeufpvjazgzepmup}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.debug=false

# --------------------------------------------------------------------------
# File uploads (car images, profile pictures)
# --------------------------------------------------------------------------
file.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# --------------------------------------------------------------------------
# Default administrator seeded on first startup - CHANGE THE PASSWORD AFTER LOGIN.
# --------------------------------------------------------------------------
admin.default.email=${ADMIN_EMAIL:admin@driveeasy.com}
admin.default.password=${ADMIN_PASSWORD:Admin@123}

# --------------------------------------------------------------------------
# Thymeleaf caching - keep true (default) in production, disable for local dev.
# --------------------------------------------------------------------------
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# Session
server.servlet.session.timeout=30m

logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:WARN}
