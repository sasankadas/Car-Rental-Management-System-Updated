<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/user_base :: layout(~{::section})}">

<section>

<style>
.detail-box { background:#fff; border-radius:24px; padding:28px; box-shadow:0 10px 30px rgba(15,23,42,.06); border:1px solid #eef2f7; max-width:820px; }
.detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:18px; }
.detail-item p { color:#6b7280; font-size:12px; text-transform:uppercase; font-weight:800; margin-bottom:4px; }
.detail-item h3 { font-size:16px; color:#111827; }
.status { padding:7px 12px; border-radius:30px; font-size:12px; font-weight:900; }
.paid { background:#dcfce7; color:#166534; }
.pending { background:#fef3c7; color:#92400e; }
.failed { background:#fee2e2; color:#991b1b; }
.action-row { margin-top:22px; display:flex; gap:12px; }
.action-row a { padding:12px 18px; border-radius:14px; font-weight:800; }
.receipt-btn { background:#dcfce7; color:#166534; }
.pay-btn { background:#2563eb; color:#fff; }
.back-btn { background:#f3f4f6; color:#111827; }
</style>

<div class="detail-box">
  <h2 th:text="${payment.paymentId}">PAY00001</h2>
  <span class="status"
        th:classappend="${payment.status == 'PAID'} ? ' paid' : (${payment.status == 'PENDING'} ? ' pending' : ' failed')"
        th:text="${payment.status}">PENDING</span>

  <div class="detail-grid">
    <div class="detail-item"><p>Booking</p><h3 th:text="'#BK' + ${payment.booking.id}">#BK1001</h3></div>
    <div class="detail-item"><p>Car</p><h3 th:text="${payment.booking.car.name}">Honda City</h3></div>
    <div class="detail-item"><p>Method</p><h3 th:text="${payment.method != null ? payment.method : 'N/A'}">CARD</h3></div>
    <div class="detail-item"><p>Transaction ID</p><h3 th:text="${payment.transactionId != null ? payment.transactionId : 'N/A'}">-</h3></div>
    <div class="detail-item"><p>Amount</p><h3>₹<span th:text="${payment.amount}">3600</span></h3></div>
    <div class="detail-item"><p>Payment Date</p><h3 th:text="${payment.paymentDate != null ? #temporals.format(payment.paymentDate,'dd MMM yyyy, hh:mm a') : 'Pending'}">-</h3></div>
  </div>

  <div class="action-row">
    <a th:if="${payment.status == 'PAID'}" th:href="@{'/user/receipt/' + ${payment.booking.id}}" class="receipt-btn">View Receipt</a>
    <a th:if="${payment.status == 'PENDING'}" th:href="@{'/user/pay-now/' + ${payment.booking.id}}" class="pay-btn">Pay Now</a>
    <a th:href="@{/user/payments}" class="back-btn">Back to Payments</a>
  </div>
</div>

</section>
</html>
