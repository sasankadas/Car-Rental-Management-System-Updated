<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/user_base :: layout(~{::section})}">

<section>

<style>
.book-wrapper {
  display: grid;
  grid-template-columns: 1fr 1.2fr;
  gap: 24px;
  max-width: 1000px;
}
.car-summary, .book-form-box {
  background: #ffffff;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  border: 1px solid #eef2f7;
}
.car-summary .car-icon-lg {
  width: 100%;
  height: 160px;
  border-radius: 18px;
  background: linear-gradient(135deg, #111827, #2563eb);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 54px;
  margin-bottom: 16px;
}
.car-summary h2 { font-size: 22px; margin-bottom: 6px; }
.car-summary p { color: #6b7280; margin-bottom: 14px; }
.meta-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.meta-chip { background: #f9fafb; border: 1px solid #eef2f7; padding: 8px 14px; border-radius: 30px; font-size: 13px; font-weight: 700; }
.price-tag { font-size: 26px; font-weight: 900; color: #2563eb; }
.price-tag small { color: #6b7280; font-size: 13px; font-weight: 700; }

.book-form-box h2 { font-size: 22px; margin-bottom: 6px; }
.book-form-box p { color: #6b7280; margin-bottom: 22px; }
.form-group { margin-bottom: 18px; }
.form-group label { display:block; font-weight:800; margin-bottom:8px; color:#374151; }
.form-group input {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid #d1d5db;
  border-radius: 15px;
  background: #f9fafb;
  font-size: 15px;
  outline: none;
}
.form-group input:focus { border-color:#2563eb; background:#fff; box-shadow:0 0 0 4px rgba(37,99,235,.12); }
.estimate-box {
  background: #eff6ff;
  border-radius: 16px;
  padding: 16px 18px;
  margin-bottom: 20px;
  font-weight: 700;
  color: #1e40af;
}
.confirm-btn {
  width: 100%;
  border: none;
  background: #2563eb;
  color: white;
  padding: 15px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 900;
  cursor: pointer;
}
.confirm-btn:hover { background:#1d4ed8; }

@media (max-width: 850px) {
  .book-wrapper { grid-template-columns: 1fr; }
}
</style>

<div class="book-wrapper">

  <div class="car-summary">
    <div class="car-icon-lg">🚗</div>
    <h2 th:text="${car.name}">Honda City</h2>
    <p th:text="${car.description}">Comfortable sedan for city and highway rides.</p>

    <div class="meta-row">
      <span class="meta-chip" th:text="${car.seats + ' Seats'}">5 Seats</span>
      <span class="meta-chip" th:text="${car.fuelType}">Petrol</span>
      <span class="meta-chip" th:text="${car.transmission}">Manual</span>
      <span class="meta-chip" th:text="${car.carType}">Sedan</span>
    </div>

    <div class="price-tag">₹<span th:text="${car.pricePerDay}">1800</span> <small>/ day</small></div>
  </div>

  <div class="book-form-box">
  
    <form th:action="@{'/user/book-car/' + ${car.id}}" method="post" id="bookForm">

      <div class="form-group">
        <label for="pickupDate">Pickup Date</label>
        <input type="date" id="pickupDate" name="pickupDate" required>
      </div>

      <div class="form-group">
        <label for="returnDate">Return Date</label>
        <input type="date" id="returnDate" name="returnDate" required>
      </div>

      <div class="estimate-box" id="estimateBox">
        Select dates to see the estimated total.
      </div>

      <button type="submit" class="confirm-btn">Request Booking</button>
    </form>
  </div>

</div>

<script th:inline="javascript">
  const pricePerDay = /*[[${car.pricePerDay}]]*/ 0;
  const pickup = document.getElementById("pickupDate");
  const ret = document.getElementById("returnDate");
  const box = document.getElementById("estimateBox");

  function updateEstimate() {
    if (!pickup.value || !ret.value) return;
    const p = new Date(pickup.value);
    const r = new Date(ret.value);
    const days = Math.round((r - p) / (1000 * 60 * 60 * 24));
    if (days > 0) {
      box.innerText = days + " day(s) × ₹" + pricePerDay + " = ₹" + (days * pricePerDay) + " (estimated)";
    } else {
      box.innerText = "Return date must be after pickup date.";
    }
  }
  pickup.addEventListener("change", updateEstimate);
  ret.addEventListener("change", updateEstimate);
</script>

</section>
</html>
