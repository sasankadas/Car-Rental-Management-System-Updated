<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{user/user_base :: layout(~{::section})}">

<section>

<style>
.profile-wrapper {
  display: grid;
  grid-template-columns: 1fr 2fr;
  gap: 24px;
}

/* LEFT CARD */
.profile-card {
  background: #ffffff;
  padding: 30px;
  border-radius: 24px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(15,23,42,0.06);
}

.profile-img {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  object-fit: cover;
  border: 4px solid #2563eb;
  margin-bottom: 12px;
}

.upload-label {
  display: inline-block;
  margin-top: 10px;
  font-size: 14px;
  color: #2563eb;
  font-weight: 800;
  cursor: pointer;
}

.profile-meta {
  margin-top: 15px;
  font-size: 14px;
  color: #6b7280;
}

/* RIGHT FORM */
.profile-form {
  background: #ffffff;
  padding: 30px;
  border-radius: 24px;
  box-shadow: 0 10px 30px rgba(15,23,42,0.06);
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  font-weight: 800;
  margin-bottom: 6px;
  display: block;
}

.form-group input,
.form-group textarea {
  width: 100%;
  padding: 14px;
  border-radius: 14px;
  border: 1px solid #e5e7eb;
  background: #f9fafb;
}

.form-group textarea {
  resize: none;
}

.readonly {
  background: #f3f4f6;
}

.save-btn {
  background: #2563eb;
  color: #fff;
  border: none;
  padding: 14px;
  width: 100%;
  border-radius: 16px;
  font-weight: 900;
  cursor: pointer;
}

.save-btn:hover {
  background: #1d4ed8;
}

/* RESPONSIVE */
@media(max-width:900px){
  .profile-wrapper {
    grid-template-columns: 1fr;
  }
}
</style>

<div class="profile-wrapper">

  <!-- LEFT PROFILE -->
  <div class="profile-card">

    <img id="preview"
         th:src="${user.profileImage != null} ? @{/images/{img}(img=${user.profileImage})} : @{/images/default.png}"
         class="profile-img">

    <h3 th:text="${user.name}">User Name</h3>
    <p th:text="${user.email}">user@email.com</p>

    <label class="upload-label">
      Change Photo
      <input type="file" name="image" hidden onchange="previewImage(event)">
    </label>

    <div class="profile-meta">
      <p>Status: <b th:text="${user.enabled ? 'Verified' : 'Not Verified'}"></b></p>
      <p>Role: <b th:text="${user.role}"></b></p>
    </div>

  </div>

  <!-- RIGHT FORM -->
  <form class="profile-form"
        th:action="@{/user/update-profile}"
        method="post"
        enctype="multipart/form-data"
        th:object="${user}">

    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{profileImage}">

    <div class="form-group">
      <label>Name</label>
      <input type="text" th:field="*{name}" required>
    </div>

    <div class="form-group">
      <label>Email</label>
      <input type="email" th:field="*{email}" readonly class="readonly">
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text" th:field="*{phone}">
    </div>

    <div class="form-group">
      <label>Address</label>
      <textarea rows="3" th:field="*{address}"></textarea>
    </div>

    <div class="form-group">
      <label>Account Created</label>
      <input type="text"
             th:value="${#temporals.format(user.createdAt,'dd MMM yyyy')}"
             readonly class="readonly">
    </div>

    <button class="save-btn">Update Profile</button>

  </form>

</div>

<script>
function previewImage(event) {
  const reader = new FileReader();
  reader.onload = function(){
    document.getElementById('preview').src = reader.result;
  }
  reader.readAsDataURL(event.target.files[0]);
}
</script>

</section>
</html>
