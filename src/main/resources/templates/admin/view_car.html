<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin_base :: layout(~{::section})}">

<section>

<style>
.detail-box {
  background: #ffffff;
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  border: 1px solid #eef2f7;
  max-width: 820px;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-top: 18px;
}
.detail-item p { color: #6b7280; font-size: 12px; text-transform: uppercase; font-weight: 800; margin-bottom: 4px; }
.detail-item h3 { font-size: 16px; color: #111827; }
.car-photo { width: 100%; max-width: 320px; border-radius: 18px; margin-bottom: 12px; }
.car-placeholder-lg { width: 100%; max-width: 320px; height: 200px; border-radius: 18px; background: #eff6ff; color: #2563eb; display: flex; align-items: center; justify-content: center; font-size: 48px; margin-bottom: 12px; }
.status { padding: 7px 12px; border-radius: 30px; font-size: 12px; font-weight: 900; }
.available { background: #dcfce7; color: #166534; }
.booked { background: #fef3c7; color: #92400e; }
.maintenance { background: #fee2e2; color: #991b1b; }
.action-row { margin-top: 22px; display: flex; gap: 12px; }
.action-row a { padding: 12px 18px; border-radius: 14px; font-weight: 800; }
.edit-btn { background: #eff6ff; color: #2563eb; }
.back-btn { background: #f3f4f6; color: #111827; }
</style>

<div class="detail-box">

  <img th:if="${car.image != null}" th:src="@{/images/cars/{img}(img=${car.image})}" class="car-photo" alt="Car">
  <div th:if="${car.image == null}" class="car-placeholder-lg">🚗</div>

  <h2 th:text="${car.name}">Honda City</h2>
  <span class="status"
        th:classappend="${car.status == 'AVAILABLE'} ? ' available' : (${car.status == 'BOOKED'} ? ' booked' : ' maintenance')"
        th:text="${car.status}">AVAILABLE</span>

  <div class="detail-grid">
    <div class="detail-item"><p>Brand</p><h3 th:text="${car.brand}">Honda</h3></div>
    <div class="detail-item"><p>Model</p><h3 th:text="${car.model}">2024</h3></div>
    <div class="detail-item"><p>Car Type</p><h3 th:text="${car.carType}">Sedan</h3></div>
    <div class="detail-item"><p>Registration No.</p><h3 th:text="${car.registrationNumber}">OD-02-AB-1234</h3></div>
    <div class="detail-item"><p>Fuel Type</p><h3 th:text="${car.fuelType}">Petrol</h3></div>
    <div class="detail-item"><p>Transmission</p><h3 th:text="${car.transmission}">Manual</h3></div>
    <div class="detail-item"><p>Seats</p><h3 th:text="${car.seats}">5</h3></div>
    <div class="detail-item"><p>Price / Day</p><h3>₹<span th:text="${car.pricePerDay}">1800</span></h3></div>
    <div class="detail-item"><p>Added By</p><h3 th:text="${car.addedBy != null ? car.addedBy.name : 'Admin'}">Admin</h3></div>
    <div class="detail-item"><p>Added On</p><h3 th:text="${car.createdAt != null ? #temporals.format(car.createdAt,'dd MMM yyyy') : 'N/A'}">-</h3></div>
  </div>

  <div class="detail-item" style="margin-top:18px;">
    <p>Description</p>
    <h3 style="font-weight:600;" th:text="${car.description}">No description provided.</h3>
  </div>

  <div class="action-row">
    <a th:href="@{'/admin/cars/edit/' + ${car.id}}" class="edit-btn">Edit Car</a>
    <a th:href="@{/admin/cars}" class="back-btn">Back to Cars</a>
  </div>

</div>

</section>
</html>
