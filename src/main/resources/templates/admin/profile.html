<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin_base :: layout(~{::section})}">

<section>

<style>
  .profile-wrapper {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: 24px;
  }

  .profile-card,
  .profile-form {
    background: #ffffff;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
  }

  .profile-card {
    text-align: center;
  }

  .profile-img,
  .profile-avatar {
    width: 125px;
    height: 125px;
    border-radius: 50%;
    margin: 0 auto 14px;
    border: 5px solid #eff6ff;
  }

  .profile-img {
    object-fit: cover;
  }

  .profile-avatar {
    background: linear-gradient(135deg, #111827, #2563eb);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 46px;
    font-weight: 900;
  }

  .profile-card h3 {
    font-size: 24px;
    margin-bottom: 6px;
  }

  .profile-card p {
    color: #6b7280;
    font-size: 14px;
    word-break: break-all;
  }

  .badge-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 18px 0;
    flex-wrap: wrap;
  }

  .badge {
    padding: 8px 13px;
    border-radius: 30px;
    font-size: 12px;
    font-weight: 900;
  }

  .role-badge {
    background: #eff6ff;
    color: #2563eb;
  }

  .verified {
    background: #dcfce7;
    color: #166534;
  }

  .not-verified {
    background: #fee2e2;
    color: #991b1b;
  }

  .upload-label {
    display: inline-block;
    background: #eff6ff;
    color: #2563eb;
    padding: 12px 18px;
    border-radius: 15px;
    font-weight: 900;
    cursor: pointer;
    margin-top: 8px;
  }

  .profile-form h2 {
    font-size: 26px;
    margin-bottom: 6px;
  }

  .profile-form p {
    color: #6b7280;
    margin-bottom: 24px;
  }

  .form-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group.full {
    grid-column: span 2;
  }

  .form-group label {
    display: block;
    font-weight: 800;
    margin-bottom: 8px;
    color: #374151;
  }

  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 14px 15px;
    border: 1px solid #d1d5db;
    border-radius: 15px;
    background: #f9fafb;
    font-size: 15px;
    outline: none;
  }

  .form-group textarea {
    resize: none;
  }

  .form-group input:focus,
  .form-group textarea:focus {
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  }

  .readonly {
    background: #f3f4f6 !important;
    color: #6b7280;
  }

  .button-row {
    display: flex;
    justify-content: flex-end;
    gap: 14px;
    margin-top: 8px;
  }

  .save-btn,
  .cancel-btn {
    border: none;
    padding: 14px 22px;
    border-radius: 15px;
    font-weight: 900;
    cursor: pointer;
  }

  .save-btn {
    background: #2563eb;
    color: white;
  }

  .cancel-btn {
    background: #fee2e2;
    color: #991b1b;
  }

  @media (max-width: 900px) {
    .profile-wrapper {
      grid-template-columns: 1fr;
    }

    .form-grid {
      grid-template-columns: 1fr;
    }

    .form-group.full {
      grid-column: span 1;
    }

    .button-row {
      flex-direction: column;
    }
  }
</style>

<div class="profile-wrapper">

  <!-- Admin Profile Card -->
  <div class="profile-card">

    <img th:if="${admin.profileImage != null}"
         id="previewImage"
         th:src="@{/images/{img}(img=${admin.profileImage})}"
         class="profile-img"
         alt="Admin Image">

    <div th:if="${admin.profileImage == null}"
         id="avatarPreview"
         class="profile-avatar"
         th:text="${#strings.substring(admin.name,0,1)}">
      A
    </div>

    <h3 th:text="${admin.name}">Admin Name</h3>
    <p th:text="${admin.email}">admin@email.com</p>

    <div class="badge-row">
      <span class="badge role-badge" th:text="${admin.role}">ADMIN</span>
      <span class="badge"
            th:classappend="${admin.enabled} ? ' verified' : ' not-verified'"
            th:text="${admin.enabled ? 'Verified' : 'Not Verified'}">
        Verified
      </span>
    </div>

    <label class="upload-label">
      Change Photo
      <input type="file"
             name="imageFile"
             accept="image/*"
             hidden
             form="adminProfileForm"
             onchange="previewProfileImage(event)">
    </label>

  </div>

  <!-- Admin Profile Form -->
  <form id="adminProfileForm"
        class="profile-form"
        th:action="@{/admin/profile/update}"
        method="post"
        enctype="multipart/form-data"
        th:object="${admin}">

    <input type="hidden" th:field="*{id}">
    <input type="hidden" th:field="*{profileImage}">
    <input type="hidden" th:field="*{password}">
    <input type="hidden" th:field="*{role}">
    <input type="hidden" th:field="*{enabled}">
    <input type="hidden" th:field="*{verificationToken}">
    <input type="hidden" th:field="*{tokenExpiryTime}">

    <div class="form-grid">

      <div class="form-group">
        <label>Name</label>
        <input type="text" th:field="*{name}" required>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{email}" class="readonly" readonly>
      </div>

      <div class="form-group">
        <label>Phone</label>
        <input type="text" th:field="*{phone}" placeholder="Enter phone number">
      </div>

      <div class="form-group">
        <label>Role</label>
        <input type="text" th:value="${admin.role}" class="readonly" readonly>
      </div>

      <div class="form-group full">
        <label>Address</label>
        <textarea rows="3" th:field="*{address}" placeholder="Enter address"></textarea>
      </div>

      <div class="form-group">
        <label>Account Created</label>
        <input type="text"
               th:value="${admin.createdAt != null ? #temporals.format(admin.createdAt, 'dd MMM yyyy, hh:mm a') : 'N/A'}"
               class="readonly"
               readonly>
      </div>

      <div class="form-group">
        <label>Last Updated</label>
        <input type="text"
               th:value="${admin.updatedAt != null ? #temporals.format(admin.updatedAt, 'dd MMM yyyy, hh:mm a') : 'N/A'}"
               class="readonly"
               readonly>
      </div>

    </div>

    <div class="button-row">
      <a th:href="@{/admin/dashboard}" href="/admin/dashboard" class="cancel-btn">Cancel</a>
      <button type="submit" class="save-btn">Update Profile</button>
    </div>

  </form>

</div>

<script>
  function previewProfileImage(event) {
    const file = event.target.files[0];
    const avatar = document.getElementById("avatarPreview");
    let image = document.getElementById("previewImage");

    if (!file) return;

    if (!image) {
      image = document.createElement("img");
      image.id = "previewImage";
      image.className = "profile-img";
      image.alt = "Admin Image";
      avatar.replaceWith(image);
    }

    image.src = URL.createObjectURL(file);
  }
</script>

</section>
</html>
