<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin_base :: layout(~{::section})}">

<section>

  <style>
    .password-box {
      max-width: 650px;
      background: #ffffff;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .password-box h2 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .password-box p {
      color: #6b7280;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: 800;
      margin-bottom: 8px;
      color: #374151;
    }

    .form-group input {
      width: 100%;
      padding: 14px 15px;
      border: 1px solid #d1d5db;
      border-radius: 15px;
      background: #f9fafb;
      font-size: 15px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .message-text {
      display: block;
      margin-top: 7px;
      font-size: 13px;
      font-weight: 800;
    }

    .change-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 15px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      margin-top: 8px;
    }

    .change-btn:hover {
      background: #1d4ed8;
    }
  </style>

  <div class="password-box">


    <form th:action="@{/admin/change-password}" method="post" onsubmit="return validatePassword()">

      <div class="form-group">
        <label for="oldPassword">Current Password</label>
        <input type="password"
               id="oldPassword"
               name="oldPassword"
               placeholder="Enter current password"
               required>
      </div>

      <div class="form-group">
        <label for="newPassword">New Password</label>
        <input type="password"
               id="newPassword"
               name="newPassword"
               placeholder="Enter new password"
               minlength="6"
               required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password"
               id="confirmPassword"
               name="confirmPassword"
               placeholder="Re-enter new password"
               minlength="6"
               required>
        <span id="passwordMessage" class="message-text"></span>
      </div>

      <button type="submit" class="change-btn">Update Password</button>
    </form>
  </div>

  <script>
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const passwordMessage = document.getElementById("passwordMessage");

    function checkPasswordMatch() {
      if (confirmPassword.value.length === 0) {
        passwordMessage.innerText = "";
        return false;
      }

      if (newPassword.value !== confirmPassword.value) {
        passwordMessage.innerText = "Passwords do not match";
        passwordMessage.style.color = "#dc2626";
        return false;
      }

      passwordMessage.innerText = "Passwords matched";
      passwordMessage.style.color = "#16a34a";
      return true;
    }

    newPassword.addEventListener("keyup", checkPasswordMatch);
    confirmPassword.addEventListener("keyup", checkPasswordMatch);

    function validatePassword() {
      if (newPassword.value !== confirmPassword.value) {
        passwordMessage.innerText = "Passwords do not match";
        passwordMessage.style.color = "#dc2626";
        confirmPassword.focus();
        return false;
      }
      return true;
    }
  </script>

</section>
</html>
