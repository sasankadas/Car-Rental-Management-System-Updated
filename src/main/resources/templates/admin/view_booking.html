<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/admin_base :: layout(~{::section})}">

<section>

<style>
.detail-box { background:#fff; border-radius:24px; padding:28px; box-shadow:0 10px 30px rgba(15,23,42,.06); border:1px solid #eef2f7; max-width:820px; }
.detail-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:18px; }
.detail-item p { color:#6b7280; font-size:12px; text-transform:uppercase; font-weight:800; margin-bottom:4px; }
.detail-item h3 { font-size:16px; color:#111827; }
.status { padding:7px 12px; border-radius:30px; font-size:12px; font-weight:900; }
.pending { background:#fef3c7; color:#92400e; }
.approved { background:#dbeafe; color:#1e40af; }
.rejected { background:#fee2e2; color:#991b1b; }
.completed { background:#dcfce7; color:#166534; }
.cancelled { background:#f3f4f6; color:#374151; }
.action-row { margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; }
.action-row a, .action-row button { padding:12px 18px; border-radius:14px; font-weight:800; border:none; cursor:pointer; }
.back-btn { background:#f3f4f6; color:#111827; }
.approve-btn { background:#dcfce7; color:#166534; }
.reject-btn { background:#fee2e2; color:#991b1b; }
.complete-btn { background:#dbeafe; color:#1e40af; }
</style>

<div class="detail-box">
  <h2>Booking <span th:text="'#BK' + ${booking.id}">#BK1001</span></h2>
  <span class="status"
        th:classappend="${booking.status == 'APPROVED'} ? ' approved' : (${booking.status == 'REJECTED'} ? ' rejected' : (${booking.status == 'COMPLETED'} ? ' completed' : (${booking.status == 'CANCELLED'} ? ' cancelled' : ' pending')))"
        th:text="${booking.status}">PENDING</span>

  <div class="detail-grid">
    <div class="detail-item"><p>Customer</p><h3 th:text="${booking.user.name}">Sasanka</h3></div>
    <div class="detail-item"><p>Email</p><h3 th:text="${booking.user.email}">user@email.com</h3></div>
    <div class="detail-item"><p>Car</p><h3 th:text="${booking.car.name}">Honda City</h3></div>
    <div class="detail-item"><p>Registration No.</p><h3 th:text="${booking.car.registrationNumber}">OD-02-AB-1234</h3></div>
    <div class="detail-item"><p>Pickup Date</p><h3 th:text="${booking.pickupDate}">2026-05-08</h3></div>
    <div class="detail-item"><p>Return Date</p><h3 th:text="${booking.returnDate}">2026-05-10</h3></div>
    <div class="detail-item"><p>Total Days</p><h3 th:text="${booking.totalDays}">2</h3></div>
    <div class="detail-item"><p>Total Amount</p><h3>₹<span th:text="${booking.totalAmount}">3600</span></h3></div>
    <div class="detail-item"><p>Requested On</p><h3 th:text="${#temporals.format(booking.bookingDate,'dd MMM yyyy, hh:mm a')}">-</h3></div>
    <div class="detail-item"><p>Payment Status</p><h3 th:text="${payment != null ? payment.status : 'N/A'}">PENDING</h3></div>
  </div>

  <div class="action-row">
    <form th:if="${booking.status == 'PENDING'}" th:action="@{'/admin/bookings/approve/' + ${booking.id}}" method="post" style="display:inline;">
      <button type="submit" class="approve-btn" onclick="return confirm('Approve this booking?')">Approve</button>
    </form>
    <form th:if="${booking.status == 'PENDING'}" th:action="@{'/admin/bookings/reject/' + ${booking.id}}" method="post" style="display:inline;">
      <button type="submit" class="reject-btn" onclick="return confirm('Reject this booking?')">Reject</button>
    </form>
    <form th:if="${booking.status == 'APPROVED'}" th:action="@{'/admin/bookings/complete/' + ${booking.id}}" method="post" style="display:inline;">
      <button type="submit" class="complete-btn" onclick="return confirm('Mark this booking as completed?')">Mark Completed</button>
    </form>
    <a th:href="@{/admin/bookings}" class="back-btn">Back to Bookings</a>
  </div>
</div>

</section>
</html>
