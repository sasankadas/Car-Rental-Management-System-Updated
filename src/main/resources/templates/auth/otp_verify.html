<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Verify OTP</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .otp-card {
        width: 100%;
        max-width: 430px;
        background: white;
        padding: 35px;
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        text-align: center;
    }

    .otp-card h2 {
        margin-bottom: 10px;
        color: #222;
    }

    .otp-card p {
        color: #666;
        font-size: 14px;
        margin-bottom: 25px;
    }

    .form-group {
        text-align: left;
        margin-bottom: 20px;
    }

    label {
        font-weight: bold;
        font-size: 14px;
        color: #333;
    }

    input {
        width: 100%;
        padding: 13px;
        margin-top: 8px;
        border: 1px solid #ccc;
        border-radius: 10px;
        font-size: 16px;
        box-sizing: border-box;
    }

    .btn {
        width: 100%;
        padding: 13px;
        background: #1e3c72;
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
    }

    .btn:hover {
        background: #16325f;
    }

    .alert-success {
        background: #d4edda;
        color: #155724;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .alert-error {
        background: #f8d7da;
        color: #721c24;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 15px;
    }

    .links {
        margin-top: 20px;
        font-size: 14px;
    }

    .links a {
        color: #1e3c72;
        text-decoration: none;
        font-weight: bold;
    }
</style>
</head>

<body>

<div class="otp-card">

    <h2>Verify OTP</h2>
    <p>Enter the 6-digit OTP sent to your email.</p>

    <div th:if="${success}" class="alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert-error" th:text="${error}"></div>

    <form th:action="@{/verify-reset-otp}" method="post">

        <input type="hidden" name="email" th:value="${param.email}" />

        <div class="form-group">
            <label>OTP</label>
            <input type="text"
                   name="otp"
                   maxlength="6"
                   placeholder="Enter OTP"
                   required>
        </div>

        <button type="submit" class="btn">Verify OTP</button>

    </form>

    <div class="links">
        <a th:href="@{/forgot-password}">Change Email</a>
    </div>

</div>

</body>
</html>
