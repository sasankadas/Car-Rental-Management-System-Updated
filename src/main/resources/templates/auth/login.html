<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DriveEasy - Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
	crossorigin="anonymous">

<style>
* {
	margin: 0;
	padding: 0;
	box-sizing: border-box;
	font-family: "Segoe UI", Arial, sans-serif;
}

body {
	min-height: 100vh;
	background: #eef4ff;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 25px;
	color: #111827;
}

a {
	text-decoration: none;
}

.login-wrapper {
	width: 100%;
	max-width: 1000px;
	min-height: 650px;
	background: #ffffff;
	border-radius: 32px;
	overflow: hidden;
	display: grid;
	grid-template-columns: 1fr 1fr;
	box-shadow: 0 25px 70px rgba(15, 23, 42, 0.16);
}

/* Left Illustration */
.illustration-side {
	background: linear-gradient(135deg, #1d4ed8, #111827);
	position: relative;
	overflow: hidden;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 40px;
}

.illustration-side::before {
	content: "";
	position: absolute;
	width: 380px;
	height: 380px;
	background: rgba(255, 255, 255, 0.1);
	border-radius: 50%;
	top: -120px;
	left: -100px;
}

.illustration-side::after {
	content: "";
	position: absolute;
	width: 300px;
	height: 300px;
	background: rgba(255, 255, 255, 0.08);
	border-radius: 50%;
	bottom: -90px;
	right: -80px;
}

.road {
	position: absolute;
	bottom: 0;
	width: 120%;
	height: 180px;
	background: #0f172a;
	transform: skewY(-5deg);
	transform-origin: left;
}

.road-line {
	position: absolute;
	bottom: 88px;
	left: 0;
	width: 100%;
	height: 8px;
	background: repeating-linear-gradient(to right, #ffffff 0, #ffffff 55px, transparent
		55px, transparent 105px);
	opacity: 0.85;
	transform: skewY(-5deg);
}

.sun {
	position: absolute;
	top: 70px;
	right: 90px;
	width: 90px;
	height: 90px;
	border-radius: 50%;
	background: #facc15;
	box-shadow: 0 0 50px rgba(250, 204, 21, 0.55);
}

.cloud {
	position: absolute;
	width: 110px;
	height: 38px;
	background: rgba(255, 255, 255, 0.18);
	border-radius: 40px;
}

.cloud::before, .cloud::after {
	content: "";
	position: absolute;
	background: rgba(255, 255, 255, 0.18);
	border-radius: 50%;
}

.cloud::before {
	width: 45px;
	height: 45px;
	left: 18px;
	top: -20px;
}

.cloud::after {
	width: 55px;
	height: 55px;
	right: 12px;
	top: -28px;
}

.cloud-one {
	top: 150px;
	left: 70px;
}

.cloud-two {
	top: 230px;
	right: 60px;
	transform: scale(0.75);
}

.car-illustration {
	position: relative;
	z-index: 5;
	width: 390px;
	height: 210px;
	margin-top: 80px;
}

.car-top {
	position: absolute;
	width: 210px;
	height: 90px;
	background: #60a5fa;
	left: 85px;
	top: 28px;
	border-radius: 90px 90px 20px 20px;
	border: 8px solid rgba(255, 255, 255, 0.16);
}

.car-window-left, .car-window-right {
	position: absolute;
	top: 43px;
	width: 72px;
	height: 50px;
	background: #dbeafe;
	z-index: 6;
}

.car-window-left {
	left: 112px;
	border-radius: 50px 8px 8px 8px;
}

.car-window-right {
	right: 105px;
	border-radius: 8px 50px 8px 8px;
}

.car-body {
	position: absolute;
	width: 360px;
	height: 105px;
	background: #ffffff;
	left: 15px;
	top: 90px;
	border-radius: 70px 80px 35px 35px;
	box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
}

.car-front-light, .car-back-light {
	position: absolute;
	width: 34px;
	height: 18px;
	top: 128px;
	z-index: 7;
	border-radius: 20px;
}

.car-front-light {
	right: 18px;
	background: #facc15;
}

.car-back-light {
	left: 22px;
	background: #ef4444;
}

.wheel {
	position: absolute;
	width: 75px;
	height: 75px;
	background: #020617;
	border-radius: 50%;
	bottom: -18px;
	z-index: 8;
	border: 10px solid #475569;
}

.wheel::after {
	content: "";
	position: absolute;
	width: 20px;
	height: 20px;
	background: #e5e7eb;
	border-radius: 50%;
	top: 17px;
	left: 17px;
}

.wheel-left {
	left: 65px;
}

.wheel-right {
	right: 65px;
}

/* Right Form */
.form-side {
	padding: 30px 32px;
	display: flex;
	flex-direction: column;
	justify-content: center;
}

.brand {
	font-size: 30px;
	font-weight: 850;
	color: #2563eb;
	margin-bottom: 10px;
}

.brand span {
	color: #111827;
}

.form-title h1 {
	font-size: 36px;
	margin-bottom: 2px;
	color: #111827;
}

.form-title p {
	color: #6b7280;
	margin-bottom: 32px;
	line-height: 1.6;
}

.input-group {
	margin-bottom: 18px;
}

.input-group label {
	display: block;
	font-size: 15px;
	font-weight: 700;
	margin-bottom: 8px;
	color: #374151;
}

.input-group input {
	width: 100%;
	padding: 15px 16px;
	border: 1px solid #d1d5db;
	border-radius: 15px;
	font-size: 15px;
	outline: none;
	transition: 0.3s;
	background: #f9fafb;
}

.input-group input:focus {
	border-color: #2563eb;
	background: #ffffff;
	box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
}

.form-options {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin: 6px 0 24px;
	font-size: 14px;
}

.remember {
	display: flex;
	align-items: center;
	gap: 8px;
	color: #4b5563;
}

.forgot-link {
	color: #2563eb;
	font-weight: 700;
}

.login-submit {
	width: 100%;
	border: none;
	padding: 15px;
	border-radius: 16px;
	background: #2563eb;
	color: white;
	font-size: 16px;
	font-weight: 800;
	cursor: pointer;
	transition: 0.3s;
	box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
}

.login-submit:hover {
	background: #1d4ed8;
	transform: translateY(-2px);
}

.divider {
	display: flex;
	align-items: center;
	gap: 14px;
	margin: 10px 0;
	color: #9ca3af;
	font-size: 14px;
}

.divider::before, .divider::after {
	content: "";
	height: 1px;
	flex: 1;
	background: #e5e7eb;
}

.oauth-buttons {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 14px;
}

.oauth-btn {
	border: 1px solid #e5e7eb;
	background: #ffffff;
	padding: 13px;
	border-radius: 15px;
	cursor: pointer;
	font-weight: 800;
	color: #374151;
	display: flex;
	align-items: center;
	justify-content: center;
	gap: 9px;
	transition: 0.3s;
	font-size: 15px;
}

.oauth-btn:hover {
	transform: translateY(-2px);
	box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
}

.oauth-icon {
	width: 24px;
	height: 24px;
	border-radius: 50%;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: 900;
}

.google-icon {
	color: #ea4335;
	background: #fff1f2;
}

.github-icon {
	color: #111827;
	background: #f3f4f6;
}

.create-account {
	margin-top: 10px;
	text-align: center;
	color: #6b7280;
	font-size: 15px;
}

.create-account a {
	color: #2563eb;
	font-weight: 800;
}

@media ( max-width : 900px) {
	body {
		padding: 0;
		background: #ffffff;
	}
	.login-wrapper {
		grid-template-columns: 1fr;
		min-height: 100vh;
		border-radius: 0;
	}
	.illustration-side {
		min-height: 300px;
	}
	.car-illustration {
		transform: scale(0.75);
		margin-top: 40px;
	}
	.form-side {
		padding: 40px 25px;
	}
}

@media ( max-width : 480px) {
	.oauth-buttons {
		grid-template-columns: 1fr;
	}
	.form-options {
		align-items: flex-start;
		flex-direction: column;
		gap: 12px;
	}
	.form-title h1 {
		font-size: 30px;
	}
}
</style>
</head>
<body>

	<div class="login-wrapper">

		<!-- Left Side Illustration Only -->
		<div class="illustration-side">
			<div class="sun"></div>
			<div class="cloud cloud-one"></div>
			<div class="cloud cloud-two"></div>
			<div class="road"></div>
			<div class="road-line"></div>

			<div class="car-illustration">
				<div class="car-top"></div>
				<div class="car-window-left"></div>
				<div class="car-window-right"></div>
				<div class="car-body"></div>
				<div class="car-front-light"></div>
				<div class="car-back-light"></div>
				<div class="wheel wheel-left"></div>
				<div class="wheel wheel-right"></div>
			</div>
		</div>

		<!-- Right Side Login Form -->
		<div class="form-side">
			<div class="brand">
				Drive<span>Easy</span>
			</div>
			<div th:if="${success}"
				class="alert alert-success d-flex align-items-center">
				<span>✅</span> <span class="ms-2" th:text="${success}"></span>
			</div>
			<div th:if="${error}"
				class="alert alert-danger d-flex align-items-center">
				<span>❌</span> <span class="ms-2" th:text="${error}"></span>
			</div>

			<div class="form-title">

				<p>Login to manage bookings, payments, receipts, and your rental
					cars.</p>
			</div>

			<!-- For Spring Boot Thymeleaf, use th:action="@{/login}" -->
			<form action="/login" method="post">
				<div class="input-group">
					<label for="email">Email Address</label> <input type="email"
						id="email" name="username" placeholder="Enter your email" required />
				</div>

				<div class="input-group">
					<label for="password">Password</label> <input type="password"
						id="password" name="password" placeholder="Enter your password"
						required />
				</div>

				<div class="form-options">
					<label class="remember"> <input type="checkbox"
						name="remember-me" /> Remember me
					</label> <a href="/forgot-password" class="forgot-link">Forgot
						Password?</a>
				</div>

				<button type="submit" class="login-submit">Login</button>
			</form>

			<div class="divider">or continue with</div>

			<div class="oauth-buttons">
				<a href="/oauth2/authorization/google" class="oauth-btn"> <span
					class="oauth-icon google-icon">G</span> Google
				</a> <a href="/oauth2/authorization/github" class="oauth-btn"> <span
					class="oauth-icon github-icon">⌘</span> GitHub
				</a>
			</div>

			<div class="create-account">
				Don’t have an account? <a th:href="@{/register}">Create new
					account</a>
			</div>
		</div>

	</div>
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</body>
</html>
