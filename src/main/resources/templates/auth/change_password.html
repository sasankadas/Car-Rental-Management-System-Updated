<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} ?: 'DriveEasy - Change Password'">DriveEasy - Change Password</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #eef4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      color: #111827;
    }

    a {
      text-decoration: none;
    }

    .password-wrapper {
      width: 100%;
      max-width: 1000px;
      min-height: 650px;
      background: #ffffff;
      border-radius: 32px;
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
      box-shadow: 0 25px 70px rgba(15, 23, 42, 0.16);
    }

    /* Left Illustration Only */
    .illustration-side {
      background: linear-gradient(135deg, #1d4ed8, #111827);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .illustration-side::before {
      content: "";
      position: absolute;
      width: 360px;
      height: 360px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      top: -120px;
      left: -100px;
    }

    .illustration-side::after {
      content: "";
      position: absolute;
      width: 280px;
      height: 280px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      bottom: -90px;
      right: -80px;
    }

    .road {
      position: absolute;
      bottom: 0;
      width: 120%;
      height: 180px;
      background: #0f172a;
      transform: skewY(-5deg);
      transform-origin: left;
    }

    .road-line {
      position: absolute;
      bottom: 88px;
      left: 0;
      width: 100%;
      height: 8px;
      background: repeating-linear-gradient(
        to right,
        #ffffff 0,
        #ffffff 55px,
        transparent 55px,
        transparent 105px
      );
      opacity: 0.85;
      transform: skewY(-5deg);
    }

    .sun {
      position: absolute;
      top: 70px;
      right: 80px;
      width: 85px;
      height: 85px;
      border-radius: 50%;
      background: #facc15;
      box-shadow: 0 0 50px rgba(250, 204, 21, 0.55);
    }

    .cloud {
      position: absolute;
      width: 105px;
      height: 36px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 40px;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 50%;
    }

    .cloud::before {
      width: 43px;
      height: 43px;
      left: 18px;
      top: -19px;
    }

    .cloud::after {
      width: 52px;
      height: 52px;
      right: 12px;
      top: -27px;
    }

    .cloud-one {
      top: 155px;
      left: 60px;
    }

    .cloud-two {
      top: 235px;
      right: 45px;
      transform: scale(0.75);
    }

    .car-illustration {
      position: relative;
      z-index: 5;
      width: 360px;
      height: 205px;
      margin-top: 80px;
    }

    .car-top {
      position: absolute;
      width: 200px;
      height: 88px;
      background: #60a5fa;
      left: 78px;
      top: 28px;
      border-radius: 90px 90px 20px 20px;
      border: 8px solid rgba(255, 255, 255, 0.16);
    }

    .car-window-left,
    .car-window-right {
      position: absolute;
      top: 43px;
      width: 68px;
      height: 48px;
      background: #dbeafe;
      z-index: 6;
    }

    .car-window-left {
      left: 103px;
      border-radius: 50px 8px 8px 8px;
    }

    .car-window-right {
      right: 98px;
      border-radius: 8px 50px 8px 8px;
    }

    .car-body {
      position: absolute;
      width: 340px;
      height: 102px;
      background: #ffffff;
      left: 10px;
      top: 90px;
      border-radius: 70px 80px 35px 35px;
      box-shadow: 0 18px 35px rgba(0, 0, 0, 0.25);
    }

    .car-front-light,
    .car-back-light {
      position: absolute;
      width: 32px;
      height: 17px;
      top: 128px;
      z-index: 7;
      border-radius: 20px;
    }

    .car-front-light {
      right: 16px;
      background: #facc15;
    }

    .car-back-light {
      left: 18px;
      background: #ef4444;
    }

    .wheel {
      position: absolute;
      width: 72px;
      height: 72px;
      background: #020617;
      border-radius: 50%;
      bottom: -18px;
      z-index: 8;
      border: 10px solid #475569;
    }

    .wheel::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      background: #e5e7eb;
      border-radius: 50%;
      top: 17px;
      left: 17px;
    }

    .wheel-left {
      left: 58px;
    }

    .wheel-right {
      right: 58px;
    }

    /* Right Form */
    .form-side {
      padding: 55px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .brand {
      font-size: 30px;
      font-weight: 850;
      color: #2563eb;
      margin-bottom: 38px;
    }

    .brand span {
      color: #111827;
    }

    .form-title h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #111827;
    }

    .form-title p {
      color: #6b7280;
      margin-bottom: 30px;
      line-height: 1.7;
      font-size: 15.5px;
    }

    .alert {
      padding: 13px 15px;
      border-radius: 14px;
      margin-bottom: 18px;
      font-size: 14px;
      font-weight: 600;
    }

    .alert-success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .alert-error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #374151;
    }

    .input-group input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #d1d5db;
      border-radius: 15px;
      font-size: 15px;
      outline: none;
      transition: 0.3s;
      background: #f9fafb;
    }

    .input-group input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .message-text {
      display: block;
      margin-top: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .change-btn {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 16px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.25);
      margin-top: 8px;
    }

    .change-btn:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .back-login {
      margin-top: 28px;
      text-align: center;
      color: #6b7280;
      font-size: 15px;
    }

    .back-login a {
      color: #2563eb;
      font-weight: 800;
    }

    @media (max-width: 900px) {
      body {
        padding: 0;
        background: #ffffff;
      }

      .password-wrapper {
        grid-template-columns: 1fr;
        max-width: 100%;
        min-height: 100vh;
        border-radius: 0;
      }

      .illustration-side {
        min-height: 300px;
      }

      .car-illustration {
        transform: scale(0.75);
        margin-top: 40px;
      }

      .form-side {
        padding: 42px 25px;
      }
    }

    @media (max-width: 480px) {
      .form-title h1 {
        font-size: 30px;
      }

      .brand {
        margin-bottom: 26px;
      }
    }
  </style>
</head>
<body>

  <div class="password-wrapper">

    <!-- Left Side Illustration Only -->
    <div class="illustration-side">
      <div class="sun"></div>
      <div class="cloud cloud-one"></div>
      <div class="cloud cloud-two"></div>
      <div class="road"></div>
      <div class="road-line"></div>

      <div class="car-illustration">
        <div class="car-top"></div>
        <div class="car-window-left"></div>
        <div class="car-window-right"></div>
        <div class="car-body"></div>
        <div class="car-front-light"></div>
        <div class="car-back-light"></div>
        <div class="wheel wheel-left"></div>
        <div class="wheel wheel-right"></div>
      </div>
    </div>

    <!-- Right Side Change Password Form -->
    <div class="form-side">
      <div class="brand">Drive<span>Easy</span></div>

      <div class="form-title">
        <h1>Change Password</h1>
        <p>Your OTP has been verified. Now create a new password for your account.</p>
      </div>

      <div class="alert alert-success" th:if="${success}" th:text="${success}">
        OTP verified successfully.
      </div>

      <div class="alert alert-error" th:if="${error}" th:text="${error}">
        Something went wrong.
      </div>

      <form th:action="@{/change-password}" method="post" onsubmit="return validatePassword()">
        
        <!-- Send email from controller after OTP verify -->
        <input type="hidden" name="username" th:value="${email}" />

        <div class="input-group">
          <label for="newPassword">New Password</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="Enter new password"
            minlength="6"
            required
          />
        </div>

        <div class="input-group">
          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            name="confirmPassword"
            placeholder="Re-enter new password"
            minlength="6"
            required
          />
          <span id="passwordMessage" class="message-text"></span>
        </div>

        <button type="submit" class="change-btn">Update Password</button>
      </form>

      <div class="back-login">
        Remember your password? <a th:href="@{/login}" href="/login">Back to Login</a>
      </div>
    </div>

  </div>

  <script>
    const newPassword = document.getElementById("newPassword");
    const confirmPassword = document.getElementById("confirmPassword");
    const passwordMessage = document.getElementById("passwordMessage");

    function checkPasswordMatch() {
      if (confirmPassword.value.length === 0) {
        passwordMessage.innerText = "";
        return false;
      }

      if (newPassword.value !== confirmPassword.value) {
        passwordMessage.innerText = "Passwords do not match";
        passwordMessage.style.color = "#dc2626";
        return false;
      }

      passwordMessage.innerText = "Passwords matched";
      passwordMessage.style.color = "#16a34a";
      return true;
    }

    newPassword.addEventListener("keyup", checkPasswordMatch);
    confirmPassword.addEventListener("keyup", checkPasswordMatch);

    function validatePassword() {
      if (newPassword.value !== confirmPassword.value) {
        passwordMessage.innerText = "Passwords do not match";
        passwordMessage.style.color = "#dc2626";
        confirmPassword.focus();
        return false;
      }
      return true;
    }
  </script>

</body>
</html>
